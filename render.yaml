services:
  - type: web
    name: brd4-qsar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MAX_MOLECULES
        value: "250"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: LOG_LEVEL
        value: INFO
